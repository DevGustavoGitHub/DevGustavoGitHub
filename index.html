<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Mercadinho 3D</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#101418; touch-action:none; user-select:none; -webkit-user-select:none; font-family:system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; width:100%; height:100%; }
  #ui-root { position:fixed; inset:0; pointer-events:none; }
  #ui-root > * { pointer-events:auto; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui-root"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
