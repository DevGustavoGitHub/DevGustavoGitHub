<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Mercadinho 3D</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#2f9e6e" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mercadinho" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#101418; touch-action:none; user-select:none; -webkit-user-select:none; font-family:system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; width:100%; height:100%; }
  #ui-root { position:fixed; inset:0; pointer-events:none; }
  #ui-root > * { pointer-events:auto; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui-root"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
